<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<title>플랜트그램 목업 v3</title>
<style>
/* ============================================================
   디자인 시스템 — 토스/앱스토어 문법
   · 화면당 하나의 목적, 하나의 헤드라인
   · 여백이 레이아웃: 섹션 간 40px, 요소 간 8의 배수
   · 표면은 흰색. 회색(#f2f3f0)은 이미지 블록과 입력에만
   · 색은 세이지 하나. 경고만 더스티 핑크
   · 리스트는 카드가 아니라 행 — 테두리 없이 간격으로 구분
   ============================================================ */
:root{
  --canvas:#f4f2ee;
  --bg:#ffffff;
  --block:#f2f3ef;          /* 이미지·입력 블록 전용 회색 */
  --block2:#e9ede7;
  --ink:#191f1b;
  --sub:#8b928c;
  --faint:#c2c7c1;
  --sage:#3e5c4b;           /* 유일한 액센트 */
  --sage-soft:#eaf0ea;
  --pink:#c96f5e; --pink-soft:#faeae5;
  --hair:#eeefec;
  --r-block:26px;
  --phone:#111411;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro KR","Apple SD Gothic Neo","Segoe UI","Noto Sans KR",sans-serif;
  letter-spacing:-.15px;line-height:1.5}

/* ---------- 프레젠테이션 페이지 ---------- */
.intro{max-width:1280px;margin:0 auto;padding:56px 28px 8px}
.intro .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--sage);text-transform:uppercase}
.intro h1{margin:10px 0 12px;font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.2}
.intro p{margin:0;color:var(--sub);font-size:14.5px;max-width:58ch;line-height:1.75}
.gallery{display:grid;gap:56px 32px;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));
  max-width:1280px;margin:0 auto;padding:40px 28px 100px;align-items:start;justify-items:center}
.gitem{width:390px;max-width:100%}
.glabel{font-size:14px;font-weight:700;margin:0 6px 12px;color:var(--ink)}
.glabel small{color:var(--faint);font-weight:600;margin-left:8px}
.gnote{margin:14px 6px 0;font-size:13px;color:var(--sub);line-height:1.75}
.phone{background:var(--phone);border-radius:48px;padding:10px;box-shadow:0 30px 80px rgba(30,40,32,.18)}
.screen{position:relative;background:var(--bg);border-radius:39px;overflow:hidden;display:flex;flex-direction:column;min-height:844px}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  font-size:13px;font-weight:600;flex:0 0 auto}
.status .r{font-size:11px;color:var(--sub);letter-spacing:1px}

/* ---------- 공통 컴포넌트 ---------- */
.pagepad{padding:0 24px}
.h-date{font-size:13px;color:var(--sub);font-weight:600}
.h1{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.32;margin:6px 0 0}
.h1 .accent{color:var(--sage)}
.sec{font-size:16px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13.5px}
.tiny{color:var(--faint);font-size:12px}

.row{display:flex;align-items:center;gap:14px;min-height:64px}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.row .d{font-size:13px;color:var(--sub);margin-top:2px}
.chev{color:var(--faint);font-size:14px;flex:0 0 auto}

.avatar{border-radius:999px;background:var(--block);display:grid;place-items:center;flex:0 0 auto;position:relative}
.iconbtn{width:44px;height:44px;border-radius:999px;background:var(--block);border:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.iconbtn.sage{background:var(--sage-soft);color:var(--sage)}
.iconbtn.plain{background:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 12px;
  font-size:12.5px;font-weight:700}
.pill.sage{background:var(--sage-soft);color:var(--sage)}
.pill.pink{background:var(--pink-soft);color:var(--pink)}
.pill.glass{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);color:var(--ink);box-shadow:0 4px 14px rgba(30,40,32,.08)}

.cta{border:0;border-radius:20px;background:var(--sage);color:#fff;font:inherit;font-weight:700;
  font-size:16px;padding:17px;cursor:pointer;width:100%;letter-spacing:-.3px}
.cta.quiet{background:var(--block);color:var(--ink)}
.block-img{border-radius:var(--r-block);overflow:hidden;position:relative;background:var(--block)}

svg.ic{display:block}

/* ---------- 하단 탭 ---------- */
.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--hair);padding:10px 10px 22px;background:var(--bg)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--faint);font-size:10px;font-weight:600}
.nav div.on{color:var(--ink)}
.nav svg{width:23px;height:23px}

/* ---------- 셀레브레이션 컨페티 ---------- */
.cf{position:absolute;width:6px;height:10px;border-radius:3px;opacity:.8}

/* ---------- 식물 토이 카드 (본디 문법) ---------- */
.tcard{position:relative;border-radius:24px;padding:18px 18px 20px;overflow:hidden;
  box-shadow:0 18px 44px rgba(60,70,62,.16)}
.tcard .hole{width:44px;height:12px;border-radius:99px;background:rgba(0,0,0,.10);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.12);margin:0 auto}
.tcard .brand{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.tcard .brand .bl{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:13px;letter-spacing:.12em}
.tcard .brand .bc{display:flex;gap:2px;align-items:flex-end}
.tcard .brand .bc i{display:block;width:2.5px;background:rgba(0,0,0,.55)}
.tcard .plate{margin-top:10px;background:#20241f;color:#fff;border-radius:12px;padding:9px 14px;
  display:flex;align-items:baseline;gap:8px}
.tcard .plate .nm{font-size:15px;font-weight:800;letter-spacing:-.2px}
.tcard .plate .hd{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;margin-left:auto}
.tcard .bubble{margin-top:14px;border-radius:22px;height:246px;display:grid;place-items:center;position:relative;
  background:linear-gradient(155deg,rgba(255,255,255,.92),rgba(255,255,255,.55));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9), inset 0 -18px 30px rgba(40,60,45,.06), 0 8px 20px rgba(40,60,45,.08)}
.tcard .bubble::after{content:"";position:absolute;left:14px;top:12px;width:52px;height:26px;border-radius:99px;
  background:linear-gradient(120deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-18deg)}
.tcard .sticker{position:absolute;font-size:30px;filter:drop-shadow(0 4px 8px rgba(60,70,62,.25));transform:rotate(12deg)}
.tcard .cfoot{margin-top:14px;display:flex;align-items:center;gap:8px}
.tcard .cfoot .sp{font-family:Georgia,serif;font-style:italic;font-size:11.5px;color:rgba(30,40,32,.45);margin-left:auto}
.cpill{display:inline-block;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 11px;
  font-size:11.5px;font-weight:800;color:#3c463e}

/* ---------- 카드 편집기 (본디 에디터 문법) ---------- */
.ed-tabs{display:flex;justify-content:center;gap:6px}
.ed-tab{border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--faint);
  padding:8px 15px;border-radius:999px;cursor:pointer}
.ed-tab.on{background:var(--ink);color:#fff}
.ed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px}
.ed-opt{aspect-ratio:1;border-radius:18px;border:2.5px solid transparent;background:var(--block);
  display:grid;place-items:center;cursor:pointer;font-size:24px;position:relative}
.ed-opt.on{border-color:var(--ink)}
.ed-opt .sw{width:58%;height:58%;border-radius:14px}
.ed-opt .lb{position:absolute;bottom:6px;font-size:9px;font-weight:700;color:var(--sub)}

/* ---------- 시트 ---------- */
.dim{position:absolute;inset:0;background:rgba(20,26,22,.32);display:flex;align-items:flex-end;border-radius:39px}
.sheet{background:var(--bg);width:100%;border-radius:30px 30px 39px 39px;padding:8px 24px 30px}
.grab{width:36px;height:5px;border-radius:99px;background:var(--hair);margin:10px auto 22px}

@media(max-width:720px){
  .intro{padding:36px 18px 0}
  .intro h1{font-size:24px}
  .gallery{grid-template-columns:1fr;padding:28px 14px 70px;gap:44px}
  .gitem{width:100%}
  .phone{border-radius:36px;padding:8px}
  .screen{border-radius:29px}
}
</style>
</head>
<body>

<div class="intro">
  <div class="eyebrow">Plantgram · Mockup v3 · <span style="background:#3e5c4b;color:#fff;border-radius:99px;padding:2px 10px;letter-spacing:0">업데이트 v3.4 — 상세+꾸미기 통합</span></div>
  <h1>여백으로 다시 설계했습니다</h1>
  <p>화면마다 목적 하나, 헤드라인 하나. 정보는 카드가 아니라 행과 간격으로 나누고,
  색은 세이지 하나만 씁니다. 일러스트 블록이 화면의 이미지를 담당합니다 — 토스와 앱스토어 에디토리얼의 문법입니다.</p>
</div>

<div class="gallery" id="gallery"></div>

<script>
/* ============================================================
   식물 일러스트 (파스텔 세이지 톤)
   ============================================================ */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16), c=v=>Math.max(0,Math.min(255,v));
  return '#'+((c((n>>16)+amt)<<16)|(c(((n>>8)&255)+amt)<<8)|c((n&255)+amt)).toString(16).padStart(6,'0');
}
function pot(color,w){
  const d=shade(color,-22), l=shade(color,16);
  return `<path d="M${-w*.30},0 L${-w*.24},${w*.30} Q${-w*.23},${w*.35} ${-w*.18},${w*.35} L${w*.18},${w*.35} Q${w*.23},${w*.35} ${w*.24},${w*.30} L${w*.30},0 Z" fill="${color}"/>
  <path d="M${-w*.30},0 L${-w*.24},${w*.30} Q${-w*.23},${w*.35} ${-w*.18},${w*.35} L0,${w*.35} L0,0 Z" fill="${d}" opacity=".22"/>
  <rect x="${-w*.34}" y="${-w*.055}" width="${w*.68}" height="${w*.11}" rx="${w*.05}" fill="${l}"/>`;
}
function leaf(x,y,rot,s,fill,vein){
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
    <path d="M0,0 C-17,-7 -21,-29 0,-41 C21,-29 17,-7 0,0 Z" fill="${fill}"/>
    <path d="M0,-2 L0,-38" stroke="${vein}" stroke-width="1.4" opacity=".5" fill="none"/>
    <path d="M0,-14 L-9,-20 M0,-22 L-9,-28 M0,-14 L9,-20 M0,-22 L9,-28" stroke="${vein}" stroke-width="1.1" opacity=".3" fill="none"/>
  </g>`;
}
const stem=(x,y,v)=>`<path d="M0,2 Q${x*.25},${y*.45} ${x},${y}" stroke="${v}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
const AV={
  monstera(w){const a='#557f63',b='#699b78',v='#3c5c46';
    const L=[[1,-w*.50,-4,w*.0145],[-16,-w*.34,-32,w*.0135],[17,-w*.36,30,w*.0125],[-9,-w*.20,-58,w*.0100],[11,-w*.19,54,w*.0095]];
    let o='';L.forEach(([x,y])=>{o+=stem(x,y,v);});
    L.forEach(([x,y,r,s],i)=>{o+=leaf(x,y,r,s,i%2?b:a,v);});
    return o;},
  sansevieria(w){const a='#5e8a6b',b='#71a07d',e='#cabd7e';let s='';
    [[-13,-w*.52,-13,.92],[0,-w*.62,0,1.05],[13,-w*.54,13,.95],[-6,-w*.42,-6,.75],[7,-w*.44,7,.78]].forEach(([x,y,r,sc],i)=>{
      s+=`<g transform="translate(${x},0) rotate(${r})">
        <path d="M0,0 C${-5*sc},${y*.55} ${-4*sc},${y*.85} 0,${y} C${4*sc},${y*.85} ${5*sc},${y*.55} 0,0 Z" fill="${i%2?b:a}"/>
        <path d="M0,0 C${-5*sc},${y*.55} ${-4*sc},${y*.85} 0,${y}" stroke="${e}" stroke-width="1.2" fill="none" opacity=".5"/></g>`;});
    return s;},
  succulent(w){const c=['#7fa98a','#8cb795','#9ac4a2','#a9d1af'];let s='';
    for(let i=0;i<9;i++){s+=`<g transform="rotate(${i*40}) translate(0,${-w*.13})"><ellipse rx="${w*.055}" ry="${w*.105}" fill="${c[i%4]}"/></g>`;}
    return `<g transform="translate(0,${-w*.10})">${s}<circle r="${w*.05}" fill="#6a9573"/></g>`;},
  calathea(w){const a='#54806a',b='#66957a',vv='#dbe6cf';let s='';
    [[-18,-w*.32,-40,.95],[0,-w*.46,-6,1.06],[18,-w*.34,38,.97],[-8,-w*.20,-62,.72],[10,-w*.21,58,.74]].forEach(([x,y,r,sc],i)=>{
      s+=`<g transform="translate(${x},${y}) rotate(${r}) scale(${w*.012*sc})">
        <ellipse cx="0" cy="-18" rx="12" ry="21" fill="${i%2?b:a}"/>
        <ellipse cx="0" cy="-18" rx="5.5" ry="15" fill="${vv}" opacity=".5"/>
        <path d="M0,2 L0,-34" stroke="${vv}" stroke-width="1.5" opacity=".6"/></g>`;});
    return `<g><path d="M0,0 L0,${-w*.22}" stroke="#4c7059" stroke-width="2.2"/>${s}</g>`;},
  pothos(w){const a='#5c936d',b='#6da57c',v='#40684d';let s='';
    const L=[[0,-w*.40,0,.9],[-15,-w*.28,-30,.8],[15,-w*.30,30,.78],[-24,-w*.10,-72,.66],[24,-w*.12,70,.64],[-10,-w*.52,-14,.7]];
    L.forEach(([x,y])=>{s+=stem(x,y+3,v);});
    L.forEach(([x,y,r,sc],i)=>{s+=`<g transform="translate(${x},${y}) rotate(${r}) scale(${sc})">
      <path d="M0,0 C-13,-6 -16,-22 0,-30 C16,-22 13,-6 0,0 Z" fill="${i%2?a:b}"/>
      <path d="M0,-3 L0,-27" stroke="${v}" stroke-width="1.2" opacity=".45"/></g>`;});
    return s;}
};
const plant=(kind,w,potc='#c98a6a')=>`<svg width="${w}" height="${w*1.22}" viewBox="${-w/2} ${-w*.85} ${w} ${w*1.22}" style="display:block;overflow:visible">
  <ellipse cx="0" cy="${w*.37}" rx="${w*.28}" ry="${w*.05}" fill="rgba(70,90,70,.12)"/>
  ${AV[kind]?AV[kind](w):''}${pot(potc,w)}</svg>`;

/* ---------- 라인 아이콘 (SF 심볼 느낌) ---------- */
const I={
  feed:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4.5c-.8 0-1.2-1-.6-1.5l1.3-1.2A8 8 0 1 1 21 12z"/></svg>`,
  leaf:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21C7.5 16.5 7 9.5 12 4.5c5 5 4.5 12 0 16.5z"/><path d="M12 21V9"/></svg>`,
  book:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>`,
  person:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.4-3.2 4-4.8 7-4.8s5.6 1.6 7 4.8"/></svg>`,
  drop:`<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2c2.8 4 5.3 6.8 5.3 10a5.3 5.3 0 1 1-10.6 0c0-3.2 2.5-6 5.3-10z"/></svg>`,
  search:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.2 4.2"/></svg>`,
  back:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>`,
  more:`<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>`,
  bell:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.4 5.5 2 6.2H4c.6-.7 2-2.2 2-6.2z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></svg>`,
  plus:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  spark:`<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/></svg>`,
  heart:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 3c0 5.4-7.5 10-7.5 10z"/></svg>`,
  cam:`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="13" rx="3"/><path d="M9 7l1.2-2.4h3.6L15 7"/><circle cx="12" cy="13.2" r="3.4"/></svg>`,
};
const ic=(name,size=22,color='currentColor')=>I[name].replace('class="ic"',`class="ic" style="width:${size}px;height:${size}px;color:${color}"`);

/* ---------- 하단 탭 ---------- */
const nav=on=>`<div class="nav">
  <div class="${on==='feed'?'on':''}">${ic('feed')}피드</div>
  <div class="${on==='plant'?'on':''}">${ic('leaf')}내 식물</div>
  <div class="${on==='book'?'on':''}">${ic('book')}도감</div>
  <div class="${on==='me'?'on':''}">${ic('person')}계정</div>
</div>`;
const statusbar=`<div class="status"><span>9:41</span><span class="r">●●●●  ᯤ  ▮</span></div>`;

/* ---------- 꽃나무 (온실 씬용 추가 형태) ---------- */
AV.flower=function(w){
  const a='#557f63',b='#699b78',v='#3c5c46',petal='#e39aad',core='#f2d98b';
  const B=[[0,-w*.42,1],[-w*.16,-w*.32,.85],[w*.17,-w*.33,.85],[-w*.26,-w*.19,.7],[w*.27,-w*.20,.7]];
  let s='';B.forEach(([x,y])=>{s+=stem(x,y+4,v);});
  B.forEach(([x,y,c],i)=>{s+=`<circle cx="${x}" cy="${y}" r="${w*.13*c}" fill="${i%2?b:a}"/>`;});
  B.forEach(([x,y,c],i)=>{ if(i%2)return;
    s+=`<g transform="translate(${x},${y-w*.07*c})">
      ${[0,72,144,216,288].map(ang=>`<ellipse cx="0" cy="${-w*.045}" rx="${w*.032}" ry="${w*.05}" fill="${petal}" transform="rotate(${ang})"/>`).join('')}
      <circle r="${w*.026}" fill="${core}"/></g>`;});
  return s;
};

/* ---------- 홈: 아이소메트릭 온실 씬 ---------- */
function ghBlock(){
  const TW=47,TH=23.5,ZH=30,OX=195,OY=66;
  const Pp=(x,y,z=0)=>[(x-y)*TW/2+OX,(x+y)*TH/2-z*ZH+OY];
  const ptss=a=>a.map(p=>p.join(',')).join(' ');
  const G0=1,G1=6,N=7,WALL=1.9,RIDGE=2.8,MID=3.5,BENCH=.95;
  let o='';
  /* 잔디 지반 + 옆면 */
  o+=`<polygon points="${ptss([Pp(-.4,-.4),Pp(N+.4,-.4),Pp(N+.4,N+.4),Pp(-.4,N+.4)])}" fill="#cfdfba"/>`;
  const c1=Pp(-.4,N+.4),c2=Pp(N+.4,N+.4),c3=Pp(N+.4,-.4);
  o+=`<polygon points="${ptss([c1,c2,[c2[0],c2[1]+10],[c1[0],c1[1]+10]])}" fill="#adc399"/>`;
  o+=`<polygon points="${ptss([c3,c2,[c2[0],c2[1]+10],[c3[0],c3[1]+10]])}" fill="#a1b78d"/>`;
  /* 포장 타일 */
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const inside=i>=G0&&i<G1&&j>=G0&&j<G1, apron=!inside&&i>=1&&j>=1;
    if(!inside&&!apron)continue;
    o+=`<polygon points="${ptss([Pp(i,j),Pp(i+1,j),Pp(i+1,j+1),Pp(i,j+1)])}"
      fill="${inside?((i+j)%2?'#ebe6d8':'#f3efe3'):((i+j)%2?'#dbd9d1':'#e4e2da')}"
      stroke="${inside?'#dcd5c3':'#cbc9c1'}" stroke-width=".6"/>`;
  }
  /* 뒷벽 유리 + 지붕 */
  o+=`<polygon points="${ptss([Pp(G0,G0,0),Pp(G1,G0,0),Pp(G1,G0,WALL),Pp(G0,G0,WALL)])}" fill="#dcedf4" opacity=".55"/>`;
  o+=`<polygon points="${ptss([Pp(G0,G0,0),Pp(G0,G1,0),Pp(G0,G1,WALL),Pp(G0,G0,WALL)])}" fill="#e2f0f4" opacity=".5"/>`;
  o+=`<polygon points="${ptss([Pp(G0,G0,WALL),Pp(G1,G0,WALL),Pp(G1,MID,RIDGE),Pp(G0,MID,RIDGE)])}" fill="#d6e9f0" opacity=".5"/>`;
  /* 벤치 */
  const bench=(ax,ay,bx,by,d)=>{
    const isX=ay===by;
    const p1=Pp(ax,ay,BENCH),p2=Pp(bx,by,BENCH);
    const p3=isX?Pp(bx,by+d,BENCH):Pp(bx+d,by,BENCH);
    const p4=isX?Pp(ax,ay+d,BENCH):Pp(ax+d,ay,BENCH);
    const l3=isX?Pp(bx,by+d,BENCH-.09):Pp(bx+d,by,BENCH-.09);
    const l4=isX?Pp(ax,ay+d,BENCH-.09):Pp(ax+d,ay,BENCH-.09);
    return `<polygon points="${ptss([p4,p3,l3,l4])}" fill="#c0a77d"/>
            <polygon points="${ptss([p1,p2,p3,p4])}" fill="#ecdbbd"/>`;
  };
  [[1.35,1.72],[2.75,1.72],[4.2,1.72],[5.05,1.72]].forEach(([x,y])=>{
    const a=Pp(x,y,0),b=Pp(x,y,BENCH-.04);
    o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#e8e1d0" stroke-width="2.6" stroke-linecap="round"/>`;});
  o+=bench(1.15,1.15,5.2,1.15,.72);
  /* 식물 */
  const draw=(x,y,z,k,w,pc)=>{
    const [sx,sy]=Pp(x,y,z);
    return `<g transform="translate(${sx},${sy})">
      <ellipse cy="2" rx="${w*.3}" ry="${w*.08}" fill="rgba(70,90,70,.13)"/>
      ${AV[k]?AV[k](w):''}${pot(pc,w)}</g>`;
  };
  const indoor=[
    [1.7,1.45,BENCH,'sansevieria',24,'#8fa89b'],[2.8,1.45,BENCH,'succulent',21,'#dcc9a8'],
    [3.9,1.45,BENCH,'calathea',24,'#b7a3c9'],[4.9,1.45,BENCH,'succulent',20,'#e0a08c'],
    [1.6,3.1,0,'flower',38,'#b7654f'],[3.5,3.4,0,'monstera',58,'#c98a6a'],
    [5.0,2.6,0,'pothos',40,'#9fb8d0'],[2.4,4.9,0,'sansevieria',34,'#e0a08c'],[4.6,4.9,0,'calathea',38,'#a8785d'],
  ].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
  indoor.forEach(p=>{o+=draw(...p);});
  /* 앞면 유리 + 프레임 */
  o+=`<polygon points="${ptss([Pp(G0,G1,0),Pp(G1,G1,0),Pp(G1,G1,WALL),Pp(G0,G1,WALL)])}" fill="#e8f2f6" opacity=".13"/>`;
  o+=`<polygon points="${ptss([Pp(G1,G0,0),Pp(G1,G1,0),Pp(G1,G1,WALL),Pp(G1,G0,WALL)])}" fill="#e8f2f6" opacity=".11"/>`;
  o+=`<polygon points="${ptss([Pp(G0,MID,RIDGE),Pp(G1,MID,RIDGE),Pp(G1,G1,WALL),Pp(G0,G1,WALL)])}" fill="#eef6f8" opacity=".15"/>`;
  const beam=(a,b,w=3.2)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fcfbf7" stroke-width="${w}" stroke-linecap="round"/>`;
  [[G0,G0],[G1,G0],[G0,G1],[G1,G1]].forEach(([x,y])=>{o+=beam(Pp(x,y,0),Pp(x,y,WALL),3.6);});
  o+=beam(Pp(G0,G0,WALL),Pp(G1,G0,WALL))+beam(Pp(G0,G1,WALL),Pp(G1,G1,WALL))
   +beam(Pp(G0,G0,WALL),Pp(G0,G1,WALL))+beam(Pp(G1,G0,WALL),Pp(G1,G1,WALL))
   +beam(Pp(G0,MID,RIDGE),Pp(G1,MID,RIDGE),3.6)
   +beam(Pp(G0,G0,WALL),Pp(G0,MID,RIDGE))+beam(Pp(G0,G1,WALL),Pp(G0,MID,RIDGE))
   +beam(Pp(G1,G0,WALL),Pp(G1,MID,RIDGE))+beam(Pp(G1,G1,WALL),Pp(G1,MID,RIDGE));
  [[2.25,G1],[3.5,G1],[4.75,G1]].forEach(([x,y])=>{o+=beam(Pp(x,y,0),Pp(x,y,WALL),1.8);});
  [[G1,2.25],[G1,3.5],[G1,4.75]].forEach(([x,y])=>{o+=beam(Pp(x,y,0),Pp(x,y,WALL),1.8);});
  /* 마당 */
  [[2.0,6.5,0,'flower',34,'#e0a08c'],[6.5,2.2,0,'pothos',38,'#c98a6a'],[5.6,6.4,0,'succulent',26,'#dcc9a8']]
    .forEach(p=>{o+=draw(...p);});
  /* 물이 필요한 식물 말풍선 */
  [[3.5,3.4,2.05],[1.6,3.1,1.35],[6.5,2.2,1.35]].forEach(([x,y,h])=>{
    const [bx,by]=Pp(x,y,h);
    o+=`<g transform="translate(${bx},${by})">
      <rect x="-27" y="-14" width="54" height="22" rx="11" fill="#4d80e0" opacity=".92"/>
      <path d="M-3.5 8 L0 13.5 L3.5 8Z" fill="#4d80e0" opacity=".92"/>
      <text x="1" y="2.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">💧 D+1</text></g>`;
  });

  return `<div class="block-img" style="flex:1;min-height:300px;display:flex;align-items:center;background:linear-gradient(176deg,#e6eff2,#f0efe2)">
    <svg viewBox="0 6 390 254" style="width:100%;max-height:100%;display:block">${o}</svg>
    <div style="position:absolute;left:13px;top:13px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);

function gardenBlock(h=300){

  const ptss=a=>a.map(p=>p.join(',')).join(' ');

      fill="${(i+j)%2?'#edeadf':'#f4f1e6'}" stroke="#e5e0d0" stroke-width=".8"/>`;
  }
  [[.5,.5,'sansevieria',46,'#8fa89b'],[1.5,.5,'succulent',40,'#dcc9a8'],
   [2.5,.6,'calathea',46,'#b7a3c9'],[.6,1.6,'pothos',50,'#e0a08c'],
   [1.5,1.6,'monstera',72,'#c98a6a'],[2.6,2.3,'pothos',52,'#a8785d']]
  .sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(([x,y,k,w,pc])=>{

    o+=`<g transform="translate(${sx},${sy})">

      ${AV[k]?AV[k](w):''}${pot(pc,w)}</g>`;

  return `<div class="block-img" style="height:${h}px;background:linear-gradient(176deg,#e9efe6,#f3f0e4)">

}

function updStage(){const st=document.getElementById('detailStage'); if(st) st.innerHTML=stageInner(CARD);}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-edit-open]')){
    hideSheet();
    const ed=document.getElementById('detailEdit'); if(ed) ed.style.display='flex';
    edRender(); return;
  }
  if(e.target.closest('[data-edit-close]')){
    const ed=document.getElementById('detailEdit'); if(ed) ed.style.display='none';
    sheetOpen=false; applySheet();
    return;
  }
  const pv=e.target.closest('[data-pview]');
  if(pv){
    const mode=pv.dataset.pview;
    document.getElementById('pvBoard').style.display=mode==='board'?'':'none';
    document.getElementById('pvList').style.display=mode==='list'?'':'none';
    document.getElementById('plantsWrap').style.background=mode==='board'?'#f2eee3':'#fff';
    document.querySelectorAll('[data-pview]').forEach(b=>{
      const on=b.dataset.pview===mode;
      b.style.background=on?'#fff':'none';
      b.style.boxShadow=on?'0 2px 6px rgba(30,40,32,.10)':'none';
      b.style.color=on?'var(--ink)':'var(--faint)';
    });
    return;
  }
  const tab=e.target.closest('.ed-tab');
  if(tab){edCat=tab.dataset.cat;edRender();return;}
  const img=e.target.closest('[data-img]');
  if(img){CARD.img=img.dataset.img;edRender();return;}
  const co=e.target.closest('[data-cutout]');
  if(co){if(CARD.img==='photo'){CARD.cutout=!CARD.cutout;edRender();}return;}
  const stk=e.target.closest('[data-stk]');
  if(stk){
    const s=stk.dataset.stk, i=CARD.stickers.indexOf(s);
    if(i>=0) CARD.stickers.splice(i,1);
    else if(CARD.stickers.length<STICKER_POS.length) CARD.stickers.push(s);
    edRender(); return;
  }
  if(e.target.closest('[data-stk-clear]')){CARD.stickers=[];edRender();return;}
  const fo=e.target.closest('[data-font]');
  if(fo){CARD.font=fo.dataset.font;edRender();return;}
  const ik=e.target.closest('[data-ink]');
  if(ik){CARD.inkColor=ik.dataset.ink;edRender();return;}
  const opt=e.target.closest('.ed-opt');
  if(opt&&opt.dataset.v!==undefined){CARD[edCat]=opt.dataset.v;edRender();return;}
});

/* ---------- 상세 시트: 드래그로 카드 ↔ 본 내용 ---------- */
const sheetEl=document.getElementById('detailSheet');
let sheetOpen=false;
const OPEN_Y=58, PEEK_H=176;
function sheetTopY(open){const h=sheetEl.parentElement.clientHeight;return open?OPEN_Y:h-PEEK_H;}
function applySheet(anim=true){
  if(!sheetEl) return;
  sheetEl.style.transition=anim?'transform .38s cubic-bezier(.22,.9,.26,1)':'none';
  sheetEl.style.transform=`translateY(${sheetTopY(sheetOpen)}px)`;
  const body=document.getElementById('sheetBody');
  if(body){body.style.overflowY=sheetOpen?'auto':'hidden'; if(!sheetOpen) body.scrollTop=0;}
}
function hideSheet(){if(sheetEl){sheetEl.style.transition='transform .3s ease';sheetEl.style.transform='translateY(105%)';}}
if(sheetEl){
  const handle=document.getElementById('sheetHandle');
  let sy=null,base=0,moved=0;
  handle.addEventListener('pointerdown',ev=>{
    sy=ev.clientY;base=sheetTopY(sheetOpen);moved=0;
    handle.setPointerCapture(ev.pointerId);sheetEl.style.transition='none';});
  handle.addEventListener('pointermove',ev=>{
    if(sy==null)return;
    moved=ev.clientY-sy;
    const h=sheetEl.parentElement.clientHeight;
    const y=Math.min(Math.max(base+moved,OPEN_Y),h-PEEK_H);
    sheetEl.style.transform=`translateY(${y}px)`;});
  const done=()=>{
    if(sy==null)return;
    if(Math.abs(moved)<8) sheetOpen=!sheetOpen;
    else if(moved<-60) sheetOpen=true;
    else if(moved>60) sheetOpen=false;
    sy=null;applySheet();};
  handle.addEventListener('pointerup',done);
  handle.addEventListener('pointercancel',done);
  applySheet(false);
}
edRender();
</script>
